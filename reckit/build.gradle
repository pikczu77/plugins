plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = "reckit-${project.minecraft_version}"
}

fabricApi {
	// Server game tests run as part of `./gradlew build`, client game tests with `./gradlew runClientGameTest`.
	configureTests {
		createSourceSet = true
		modId = "reckit-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true // By setting this to true, you agree to the Minecraft EULA (https://aka.ms/MinecraftEULA).
	}
}

loom {
	runs {
		clientGameTest {
			// The network synchronizer stalls world loading on slow CI machines (see the Fabric docs on automated testing).
			vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Checks that every catalog item has its item definition, models, textures and names (tools/check_assets.py).
tasks.register("checkAssets", Exec) {
	commandLine "python3", "tools/check_assets.py"
}
check.dependsOn checkAssets

// Development helper to inspect Minecraft/Fabric API signatures (javap).
tasks.register("printClasspath") {
	def classpath = sourceSets.main.compileClasspath
	doLast {
		println "CLASSPATH=" + classpath.asPath
	}
}
