name: reckit

on:
  push:
    paths:
      - 'reckit/**'
      - '.github/workflows/reckit.yml'
  pull_request:
    paths:
      - 'reckit/**'
      - '.github/workflows/reckit.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: reckit

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew

      # Checks the assets (tools/check_assets.py), compiles the mod and runs the server game tests (src/gametest).
      - name: Build, check assets and run server game tests
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reckit-mod
          path: reckit/build/libs/

  client-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: chmod +x ./gradlew

      # Starts a real Minecraft client and screenshots every creative tab and every prop in hand.
      - name: Run client game test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-screenshots
          path: |
            reckit/build/run/clientGameTest/screenshots/
            reckit/build/run/clientGameTest/logs/
